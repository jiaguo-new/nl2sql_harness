run_id: e0_financial_district_hint_full_dev_errors_20260725
experiment: E0-FINANCIAL-DH-FULL-DEV
experiment_name: Financial district-hint prompt on full dev financial errors
description: Generate district-hint candidates for financial DB examples that E0 base got wrong on full BIRD dev.

dataset:
  name: BIRD
  split: dev
  source: /tmp/bird_dev_financial_errors_full_20260725.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev_200.json

model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096

prompt:
  template: prompts/e0_direct_sql_financial_district_hint.md

agent:
  per_example_timeout_seconds: 120

execution:
  timeout_seconds: 30
  max_rows: 100

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
