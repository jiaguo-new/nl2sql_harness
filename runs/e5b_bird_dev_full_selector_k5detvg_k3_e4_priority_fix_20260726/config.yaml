run_id: e5b_bird_dev_full_selector_k5detvg_k3_e4_priority_fix_20260726
experiment: E5b-SELECTOR-REPAIR
experiment_name: E5b selector priority fix on full BIRD dev (k5+detVG primary, fallback to others)
description: |
  E5b selector using the best k5+detVG source as the primary candidate,
  with k3 and E4 as complementary sources only when k5 is invalid.
  This run fixes the selector so source priority is strictly respected and
  join-count / SELECT-count heuristics cannot override the primary source.
  Internal zero-row repair is disabled; external gold-checked value-grounding
  repair will be applied to the final selected predictions.

source_names:
  - k5_detvg
  - retrieval_k3_v2
  - e4_failures
  - base
  - e3cand
  - glm_dh

source_priority:
  - k5_detvg
  - retrieval_k3_v2
  - e4_failures
  - base
  - e3cand
  - glm_dh

dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev.json

candidate_sources:
  - predictions/e5b_retrieval_k5_v2_merged_detvg_20260725/predictions.jsonl
  - predictions/e0_bird_dev_full_glm5.2_cot8k_retrieval_k3_v2_merged_20260726/predictions.jsonl
  - predictions/e4_bird_dev_retrieval_detvg_failures_210_glm5.2_20260726/predictions_full.jsonl
  - predictions/e0_bird_dev_full_glm5.2_cot8k_20260724/predictions.jsonl
  - predictions/e3_glm_candidates_full_dev_merged_20260725/predictions_full.jsonl
  - predictions/e0_financial_district_hint_full_dev_errors_20260725/predictions_full.jsonl

execution:
  timeout_seconds: 30
  max_rows: 100

selector:
  use_priority_first: true
  apply_repair: false

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
