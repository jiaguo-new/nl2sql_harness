run_id: e5b_bird_dev20_glm5.2_cot8k_20260724
experiment: E5b-COT8K
experiment_name: Self-Critique Refinement of CoT8K Predictions
description: Refine the improved E0 CoT8K predictions with a self-critique step on BIRD dev 20-subset using GLM 5.2.

dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev_20.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev_20.json

candidate_predictions: predictions/e0_bird_dev20_glm5.2_cot8k_20260724/predictions.jsonl

model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096

prompt:
  critique: prompts/e5b_self_critique.md

execution:
  timeout_seconds: 30
  max_rows: 100

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
