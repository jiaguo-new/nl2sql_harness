run_id: fusion_judge_20260729
experiment: FUSION
experiment_name: GLM-judge fusion of merged4-agent and GLM-agent
description: |
  For questions where merged4-agent and GLM-agent disagree (different SQL),
  use GLM-5.2 as a pairwise judge (execution results, no gold) to pick the
  better SQL. Ties default to merged4. Compliant.
dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev.json
  db_root: /home/dameng/bird_dev/dev_databases
model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
execution:
  timeout_seconds: 30
  max_rows: 100
output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
compliance:
  no_gold_in_prompt: true
