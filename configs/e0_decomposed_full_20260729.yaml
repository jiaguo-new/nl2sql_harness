run_id: e0_decomposed_full_20260729
experiment: E0-DECOMPOSED-COT
experiment_name: Structured step-by-step decomposition on full BIRD dev
description: |
  Stronger CoT prompt forcing 6-step analysis (tables/columns/filters/aggregation/
