run_id: e0_financial_district_hint_glm5.2_financial_failures11_20260724
experiment: E0-FINANCIAL-HINT
experiment_name: Direct SQL with financial district_id join hint (11 known financial failures)
description: Run GLM 5.2 on the 11 financial examples that the current best dev200 run fails, using the district_id join hint prompt.

dataset:
  name: BIRD
  split: dev
  source: /tmp/bird_dev_financial_failures_11.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev_200.json

model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 4096

prompt:
  template: prompts/e0_direct_sql_financial_district_hint.md

execution:
  timeout_seconds: 30
  max_rows: 100

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
