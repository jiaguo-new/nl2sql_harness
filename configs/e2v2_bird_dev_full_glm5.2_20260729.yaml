run_id: e2v2_bird_dev_full_glm5.2_20260729
experiment: E2v2-SCHEMA-LINKING
experiment_name: Two-stage schema-linking (join_keys + column-level pruning) on full BIRD dev
description: |
  Stronger E2: stage-1 LLM selects tables+columns+explicit join_keys; deterministic
  FK-closure completion; column-existence validation + question-mention fallback;
  stage-2 generates SQL on column-level pruned schema (get_schema_subset).
  Compliant: only dev schema+question+evidence, no gold, no few-shot.

dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev.json

model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 8192

prompt:
  select: prompts/e2v2_select_schema.md
  generate: prompts/e2v2_generate_sql.md

execution:
  timeout_seconds: 30
  max_rows: 100

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
