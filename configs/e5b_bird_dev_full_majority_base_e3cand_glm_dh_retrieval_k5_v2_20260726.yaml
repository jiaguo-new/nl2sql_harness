run_id: e5b_bird_dev_full_majority_base_e3cand_glm_dh_retrieval_k5_v2_20260726
experiment: E5b-SELECTOR-MAJORITY
experiment_name: E5b majority-vote selector on full BIRD dev (base + E3 + DH + retrieval)
description: |
  Majority-vote selector over the existing candidate pool.
  Candidate pool:
    - E0 GLM base predictions (cot8k)
    - E3 GLM schema/value-grounding candidates for base errors
    - financial district-hint candidates for financial base errors
    - E0 retrieval few-shot (k=5, keyword, self-correction checklist) candidates

source_names:
  - base
  - e3cand
  - glm_dh
  - retrieval_k5_v2

source_priority:
  - retrieval_k5_v2
  - base
  - e3cand
  - glm_dh

dataset:
  name: BIRD
  split: dev
  source: /home/dameng/bird_dev/dev.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_dev.json

candidate_sources:
  - predictions/e0_bird_dev_full_glm5.2_cot8k_20260724/predictions.jsonl
  - predictions/e3_glm_candidates_full_dev_merged_20260725/predictions_full.jsonl
  - predictions/e0_financial_district_hint_full_dev_errors_20260725/predictions_full.jsonl
  - predictions/e0_bird_dev_full_glm5.2_cot8k_retrieval_k5_v2_merged_20260725/predictions.jsonl

execution:
  timeout_seconds: 30
  max_rows: 100

selector:
  strategy: majority_vote

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
