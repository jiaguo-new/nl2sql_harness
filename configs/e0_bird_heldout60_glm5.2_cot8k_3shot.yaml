run_id: e0_bird_heldout60_glm5.2_cot8k_3shot_20260724
experiment: E0-COT-8K-3SHOT-H60
experiment_name: Direct SQL with CoT/Rules + 3-shot on heldout60
description: 3-shot CoT/Rules prompt on BIRD dev heldout60 subset using GLM 5.2.

dataset:
  name: BIRD
  split: heldout60
  source: /home/dameng/bird_dev/dev_heldout60.json
  db_root: /home/dameng/bird_dev/dev_databases
  data_manifest: manifests/data_bird_heldout60.json

model:
  provider: openai-compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model_name: glm-5.2
  api_key_env: GLM_API_KEY
  temperature: 0
  top_p: 1.0
  max_tokens: 8192

prompt:
  template: prompts/e0_direct_sql_cot_3shot.md

execution:
  timeout_seconds: 30
  max_rows: 100

output:
  run_dir: runs/{run_id}
  predictions: predictions/{run_id}/predictions.jsonl
  tool_traces: traces/{run_id}/tool_traces.jsonl
  errors: errors/{run_id}/errors.jsonl
  metrics: metrics/{run_id}/metrics.json

compliance:
  no_gold_in_prompt: true
  no_test_data: true
  save_api_request_id: true
